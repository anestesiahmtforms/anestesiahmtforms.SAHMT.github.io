<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d3257">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Treinamentos SAHMT</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <style>
    :root {
      color-scheme: light;
      --google-banner-height: 0px;
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0d3257;
    }

    .training-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 88% 4%, #ffffff22, transparent 24%),
        linear-gradient(180deg, #0d3257 0%, #214463 52%, #eee4d1 100%);
    }

    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      text-align: center;
    }

    .training-frame {
      position: absolute;
      z-index: 1;
      top: calc(-1 * var(--google-banner-height));
      left: 0;
      width: 100%;
      height: calc(100% + var(--google-banner-height));
      border: 0;
      background: transparent;
      opacity: 0;
      transition: opacity .18s ease;
    }

    .is-loaded .training-frame {
      opacity: 1;
    }

    .is-loaded .loading {
      display: none;
    }
  </style>
</head>
<body>
  <main class="training-stage" aria-label="Treinamentos SAHMT">
    <p class="loading" role="status">Carregando treinamentos…</p>
    <iframe
      id="trainingFrame"
      class="training-frame"
      title="Treinamentos SAHMT"
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
      allowfullscreen
    ></iframe>
  </main>
  <script>
    const TRAINING_APP_URL = "https://script.google.com/macros/s/AKfycbw8tyhilyC8czRrho0iOugr7B6L5COFZjm2x5Di4HuzsgTsw3SSlbVDFLexzYmN0m1j0g/exec";
    const params = new URLSearchParams(window.location.search);
    const trainingUrl = new URL(TRAINING_APP_URL);
    const email = String(params.get("userEmail") || "").trim();
    const trainingId = String(params.get("trainingId") || "").trim();

    if (email) trainingUrl.searchParams.set("userEmail", email);
    if (trainingId) trainingUrl.searchParams.set("trainingId", trainingId);
    trainingUrl.searchParams.set("embedded", "true");

    const frame = document.getElementById("trainingFrame");
    frame.addEventListener("load", function () {
      document.body.classList.add("is-loaded");
    });
    frame.src = trainingUrl.href;

    document.addEventListener("touchmove", function (event) {
      event.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
